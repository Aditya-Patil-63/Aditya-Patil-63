name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Aditya-Patil-63
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300C2FF&color_dots=%23161B22,%230B2942,%230B5EA8,%23007ACC,%2300C2FF&color_background=%230D1117

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
